<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <title>Terminal42</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: https: http: file: blob:; media-src 'self' data: https: file: blob:; connect-src 'self' https: http: ws: wss: file:; frame-src 'self' data: blob: file:;" />
    <style>
      html, body { margin: 0; padding: 0; background: #0E0E10; }
      #t42-boot-splash {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #0E0E10;
        z-index: 9999;
        transition: opacity 320ms ease-out;
      }
      #t42-boot-splash.t42-fade { opacity: 0; pointer-events: none; }
      #t42-boot-splash pre {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: clamp(8px, 1.8vw, 16px);
        line-height: 1.15;
        color: #4ADE80;
        white-space: pre;
        overflow: hidden;
      }
      #t42-boot-splash .t42-cursor {
        display: inline-block;
        width: 0.6em;
        background: #4ADE80;
        animation: t42-blink 600ms step-end infinite;
      }
      @keyframes t42-blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body class="bg-bg text-text-primary">
    <div id="t42-boot-splash" aria-label="Terminal 42">
      <pre id="t42-ascii"></pre>
      <script>
        (function () {
          var art = [
            ' _____                   _             _   _  _  ____  ',
            '|_   _|__ _ __ _ __ ___ (_)_ __   __ _| | | || ||___ \\ ',
            '  | |/ _ \\ \'__| \'_ ` _ \\| | \'_ \\ / _` | | | || |_ __) |',
            '  | |  __/ |  | | | | | | | | | | (_| | | |__   _/ __/ ',
            '  |_|\\___|_|  |_| |_| |_|_|_| |_|\\__,_|_|    |_||_____|'
          ].join('\n');
          var el = document.getElementById('t42-ascii');
          var i = 0;
          var speed = 8;
          function type() {
            if (i <= art.length) {
              el.textContent = art.slice(0, i);
              i++;
              setTimeout(type, speed);
            } else {
              el.innerHTML = art + '<span class="t42-cursor">&nbsp;</span>';
            }
          }
          type();
        })();
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
